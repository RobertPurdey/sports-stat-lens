services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    ports:
      - '3000:3000'
    env_file:
      - ./apps/api/.env

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    ports:
      - '5173:5173'
    volumes:
      - ./apps/web:/app
      - /app/node_modules
